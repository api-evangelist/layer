name: Layer
description: >-
  Layer is a living digital art platform that curates code-based generative
  artwork and ultra-high-resolution video art for everyday display. Its
  developer surface is an artist-facing, first-party TypeScript SDK (a browser
  global, $layer) that lets creators declare customizable parameters, register a
  canvas for screenshot capture, and supply generated video previews back to
  Layer Studio, alongside published guidelines for generative and Ultra Res
  artwork. Layer is a portfolio company of Bloomberg Beta and Emergence Capital,
  added to the API Evangelist network and enriched from its public developer
  documentation. Layer exposes a client-side SDK rather than a public REST/HTTP
  API.
